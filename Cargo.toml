[package]
name = "winamp_cli"
version = "1.1.1"
edition = "2024"
description = "winamp cli to play local drive mp3 audio music"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.0", features = ["derive", "color", "help", "cargo"] }
colored = "3.1.1"
dotenvy = "0.15.7"
crossterm = "0.29"
dialoguer = "0.12"
rodio = "0.21.1"


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"


[dev-dependencies]
tempfile = "3"
